name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml links with -fuse-ld=mold, which Ubuntu 22.04's GCC doesn't know;
  # setup-mold makes mold the default linker instead.
  RUSTFLAGS: ""

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libasound2-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libglib2.0-dev libfontconfig-dev libfreetype-dev libwayland-dev
      - name: Clang 21
        # The libwebrtc that webrtc-sys downloads ships a libc++ that needs clang 21 or later;
        # Ubuntu 22.04 has clang 14.
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        # The live tests skip themselves without a dev server.
        run: cargo test --workspace --locked -- --test-threads=1
