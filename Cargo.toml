[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor", ".dev"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
rhein-proto = { path = "crates/rhein-proto" }
rhein-net = { path = "crates/rhein-net" }
rhein-auth = { path = "crates/rhein-auth" }
rhein-store = { path = "crates/rhein-store" }
rhein-ui = { path = "crates/rhein-ui" }
rhein-rpc = { path = "crates/rhein-rpc" }
rhein-mls = { path = "crates/rhein-mls" }

anyhow = "1"
thiserror = "2"
base64 = "0.22"
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
regex = "1"
unicode-segmentation = "1.12"
emojis = "0.9"
urlencoding = "2"
opaque-ke = { version = "4.0.1", features = ["argon2", "ristretto255"] }
argon2 = "0.5"
sha2 = "0.10"
gpui = { git = "https://github.com/sonorahq/gpui", rev = "770544dfcf70fdcf0b5c6e28edb58e2fa77a7e67" }
gpui_platform = { git = "https://github.com/sonorahq/gpui", rev = "770544dfcf70fdcf0b5c6e28edb58e2fa77a7e67", features = ["font-kit", "wayland", "x11"] }

[profile.dev.package."*"]
debug = false
opt-level = 2

# openmls with Telium's GroupInfo external_pub encoding; see vendor/openmls/RHEIN.md.
[patch.crates-io]
openmls = { path = "vendor/openmls" }

# libwebrtc with RtpTransceiver::set_direction for mesh calls; see vendor/libwebrtc/RHEIN.md.
[patch."https://github.com/livekit/rust-sdks"]
libwebrtc = { path = "vendor/libwebrtc" }
