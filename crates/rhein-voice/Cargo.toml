[package]
name = "rhein-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voice and video for Rhein: Telium's mesh calls and its LiveKit-based SFU"

[dependencies]
rhein-proto.workspace = true
cpal = "0.17"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "vorbis", "flac", "wav", "pcm", "ogg", "isomp4", "aac"] }
zbus = "5"
aes-gcm = "0.10"
base64.workspace = true
getrandom = "0.3"
reqwest.workspace = true
rtrb = "0.3"
anyhow.workspace = true
log.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
# The same libwebrtc livekit uses (vendored, see vendor/libwebrtc/RHEIN.md), with the GLib loop
# the screen capturer needs on Wayland to talk to the desktop portal.
libwebrtc = { git = "https://github.com/livekit/rust-sdks", rev = "c20fa7c37e50cb97f1a588a6ad50534b53c2037e", features = ["glib-main-loop"] }
livekit = { git = "https://github.com/livekit/rust-sdks", rev = "c20fa7c37e50cb97f1a588a6ad50534b53c2037e", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }

[dev-dependencies]
livekit-api = { git = "https://github.com/livekit/rust-sdks", rev = "c20fa7c37e50cb97f1a588a6ad50534b53c2037e", default-features = false, features = ["access-token", "rustls-tls-webpki-roots"] }
env_logger.workspace = true
rhein-net.workspace = true
rhein-auth.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
